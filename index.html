<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collective Memories — Learn how to earn from everyday stories</title>
  <meta name="description" content="Earn $100-1000/month just by photographing your everyday life. No investment, no experience needed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #030c1a; }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: #F2F4F8;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* ─── BACKGROUND (from flyer) ─────────────── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 80% 60% at 15% 10%, rgba(0,180,255,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 85% 85%, rgba(120,80,255,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 50% 50%, rgba(0,120,200,0.06) 0%, transparent 60%),
        linear-gradient(170deg, #030c1a 0%, #050f20 35%, #040c1c 65%, #020810 100%);
    }
    .bg::before, .bg::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
    }
    .bg::before {
      width: 500px; height: 500px;
      top: -120px; left: -120px;
      background: radial-gradient(circle, rgba(0,200,255,0.08), transparent 70%);
    }
    .bg::after {
      width: 700px; height: 700px;
      bottom: -200px; right: -200px;
      background: radial-gradient(circle, rgba(110,60,255,0.10), transparent 70%);
    }
    .grid-lines {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 75%);
      pointer-events: none;
    }

    /* ─── TOP BRAND ─────────────── */
    .brand-top {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(10px);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #C7CCD8;
      margin-bottom: 32px;
    }
    .brand-top .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #00D4FF;
      box-shadow: 0 0 12px rgba(0,212,255,0.6);
    }

    /* ─── SCAN ME STRIP ─────────────── */
    .scan-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .scan-strip .arrow {
      color: #9333EA;
      font-size: 22px;
      letter-spacing: -0.1em;
      font-weight: 800;
    }
    .scan-strip .arrow.right { color: #00D4FF; }
    .scan-strip h1 {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #F2F4F8 0%, #ffffff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .scan-sub {
      font-family: 'Geist Mono', 'Inter', monospace;
      font-size: 12px;
      letter-spacing: 0.35em;
      color: #7A8096;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    /* ─── LANG TITLE ─────────────── */
    .lang-title {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: clamp(20px, 3vw, 28px);
      color: #C7CCD8;
      margin-bottom: 24px;
      text-align: center;
      max-width: 520px;
      line-height: 1.35;
    }

    /* ─── LANG CARDS ─────────────── */
    .lang-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 520px;
    }
    .lang-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px 26px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      text-decoration: none;
      color: #F2F4F8;
      transition: all .3s cubic-bezier(0.2, 0.8, 0.2, 1);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    .lang-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.06), transparent);
      transition: left .6s ease;
    }
    .lang-card:hover {
      transform: translateY(-3px);
      border-color: rgba(0,212,255,0.4);
      box-shadow: 0 20px 50px -20px rgba(0,212,255,0.3);
    }
    .lang-card:hover::before { left: 100%; }
    .lang-card.soon {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .lang-card.soon:hover {
      transform: none;
      border-color: rgba(255,255,255,0.10);
      box-shadow: none;
    }
    .lang-card.soon:hover::before { left: -100%; }

    .flag {
      font-size: 38px;
      line-height: 1;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }
    .lang-body {
      flex: 1;
      min-width: 0;
    }
    .lang-body .main {
      font-size: clamp(16px, 2.4vw, 19px);
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.25;
      background: linear-gradient(90deg, #9333EA 0%, #00D4FF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .lang-body .sub {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #7A8096;
      text-transform: uppercase;
    }
    .lang-card .chev {
      color: #525868;
      transition: transform .3s, color .3s;
      flex-shrink: 0;
    }
    .lang-card:hover .chev {
      transform: translateX(4px);
      color: #00D4FF;
    }
    .lang-card.soon .chev { color: #3a3f4d; }
    .lang-card.soon .sub::after {
      content: ' · coming soon';
      color: #F5B547;
      letter-spacing: 0.1em;
    }

    /* ─── FOOT ─────────────── */
    .foot {
      margin-top: 56px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #525868;
    }
    .foot b { color: #C7CCD8; }

    /* ─── RESPONSIVE ─────────────── */
    @media (max-width: 600px) {
      .lang-card { padding: 18px 18px; gap: 14px; }
      .flag { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid-lines"></div>

  <div class="brand-top" style="margin-top: 60px;">
    <span class="dot"></span>
    Collective Memories
  </div>

  <p class="lang-title" style="margin-top: 32px;">
    Choose your language<br>to continue
  </p>

  <div class="lang-list">
    <a href="id/" class="lang-card soon">
      <div class="flag">🇮🇩</div>
      <div class="lang-body">
        <div class="main">Pelajari cara menghasilkan uang dari stories sehari-hari</div>
        <div class="sub">Bahasa Indonesia</div>
      </div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a href="en/" class="lang-card soon">
      <div class="flag">🇬🇧</div>
      <div class="lang-body">
        <div class="main">Learn how to earn money from everyday stories</div>
        <div class="sub">English</div>
      </div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a href="ru/" class="lang-card">
      <div class="flag">🇷🇺</div>
      <div class="lang-body">
        <div class="main">Узнай, как зарабатывать на обычных сторис</div>
        <div class="sub">Русский</div>
      </div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <div class="foot">
    <b>@artur_leto_</b>
  </div>

  <script>
    // Prevent navigation on "soon" cards
    document.querySelectorAll('.lang-card.soon').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        const sub = el.querySelector('.sub').textContent;
        alert(`${sub} version is coming soon. For now, please use Russian version or write me in Direct: @artur_leto_`);
      });
    });
  </script>
</body>
</html>
